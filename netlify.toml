[build]
  publish = "."
  functions = "netlify/functions"

# Firebase OAuth helper (signInWithRedirect / popup) must load from the same host as authDomain.
# init.json is served from __/firebase/; auth assets are proxied from the Firebase project.
[[redirects]]
  from = "/__/auth/*"
  to = "https://codenexus-cbb96.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
