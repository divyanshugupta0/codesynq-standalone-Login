[build]
  publish = "."
  functions = "netlify/functions"

# Keep Firebase OAuth helper requests on this site while the function reads
# FIREBASE_AUTH_DOMAIN from the Netlify environment.
[[redirects]]
  from = "/__/auth/*"
  to = "/.netlify/functions/firebase-auth-proxy/:splat"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
